[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syntri-contracts"
version = "0.1.0"
description = "Public contracts for building Syntri capability packs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Domani Labs" }]
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/DomaniLabs/Syntri"
Documentation = "https://github.com/DomaniLabs/Syntri/contracts"

[tool.setuptools]
packages = ["contracts", "contracts.example_pack"]

[tool.setuptools.package-data]
"contracts.example_pack" = ["manifest.yaml", "fixtures/*.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
