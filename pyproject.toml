[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntri-contracts"
version = "0.3.1"
description = "Public contracts and building blocks for Syntri capability packs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Domani Labs" }]
keywords = ["agent", "orchestration", "capability", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Read from the imports of the extracted modules, not guessed:
#   pydantic — contracts, experience.schema, and everything typed on them
#   click    — the CLI (cli.fmt, cli.commands.pack, cli.main)
dependencies = [
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.7", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/DomaniLabs/Syntri"
Documentation = "https://github.com/DomaniLabs/Syntri/contracts"

# NOT named `syntri`: that console script belongs to syntri-core, and a second
# package claiming it would shadow the real CLI depending on install order.
[project.scripts]
syntri-pack = "syntri_contracts.cli.main:main"

[tool.setuptools]
packages = [
    "syntri_contracts",
    "syntri_contracts.contracts",
    "syntri_contracts.contracts.example_pack",
    "syntri_contracts.experience",
    "syntri_contracts.store",
    "syntri_contracts.policy",
    "syntri_contracts.nlu",
    "syntri_contracts.capabilities",
    "syntri_contracts.cli",
    "syntri_contracts.cli.commands",
]

[tool.setuptools.package-data]
# PEP 561. The packages are annotated; without this marker every consumer's
# type checker silently treats the whole contract as Any, which is the
# opposite of what a published contract is for.
"syntri_contracts.contracts" = ["py.typed", "example_pack/manifest.yaml", "example_pack/fixtures/*.json", "example_pack/README.md"]
"syntri_contracts.experience" = ["py.typed"]
"syntri_contracts.store" = ["py.typed"]
"syntri_contracts.policy" = ["py.typed"]
"syntri_contracts.nlu" = ["py.typed"]
"syntri_contracts.capabilities" = ["py.typed"]
"syntri_contracts.cli" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Same rule set syntri-core selects, so the extracted modules lint identically
# on both sides. E501 (long lines) is confined to prose docstrings.
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP017", "UP042"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
